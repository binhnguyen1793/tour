<!doctype html>
<html lang="vi" class="account-document">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tài khoản</title>
  <link rel="stylesheet" href="styles.css">

  <style>
    *{box-sizing:border-box}
    html.account-document,
    body.account-page,
    body.account-page *{
      font-family:Arial,"Helvetica Neue",Helvetica,sans-serif!important
    }

    body.account-page{
      margin:0;
      min-height:100vh;
      color:#324256;
      background:
        linear-gradient(180deg,#0876b2 0,#075f97 116px,#eef3f7 116px,#eef3f7 100%);
      font-size:14px;
      line-height:1.45;
    }

    body.account-page button,
    body.account-page input,
    body.account-page textarea,
    body.account-page select{
      font:inherit!important
    }

    .account-top{
      position:sticky;
      top:0;
      z-index:30;
      height:68px;
      background:linear-gradient(180deg,#0988c6,#0873ad);
      border-bottom:1px solid rgba(255,255,255,.2);
      box-shadow:0 2px 10px rgba(0,0,0,.14);
      color:#fff
    }

    .account-top-inner{
      width:min(1180px,calc(100% - 28px));
      height:100%;
      margin:auto;
      display:flex;
      align-items:center;
      gap:16px
    }

    .account-logo{
      display:flex;
      align-items:center;
      gap:10px;
      color:#fff;
      text-decoration:none;
      font-weight:800
    }

    .account-logo img{
      width:84px;
      max-height:48px;
      object-fit:contain
    }

    .account-top-spacer{flex:1}

    .account-top-balance{
      display:flex;
      align-items:center;
      gap:9px;
      min-height:42px;
      padding:6px 12px;
      border-radius:8px;
      background:rgba(0,57,99,.28);
      border:1px solid rgba(255,255,255,.12)
    }

    .account-top-balance small{
      display:block;
      opacity:.75;
      font-size:10px
    }

    .account-top-balance strong{
      display:block;
      font-size:15px
    }

    .account-back,
    .account-logout{
      height:38px;
      padding:0 13px;
      border:0;
      border-radius:7px;
      background:rgba(0,55,96,.28);
      color:#fff;
      text-decoration:none;
      display:grid;
      place-items:center;
      cursor:pointer
    }

    .account-shell{
      width:min(1180px,calc(100% - 28px));
      margin:22px auto 34px;
      display:grid;
      grid-template-columns:250px minmax(0,1fr);
      gap:14px;
      align-items:start
    }

    .account-sidebar{
      overflow:hidden;
      border-radius:10px;
      background:linear-gradient(180deg,#0785c2,#0675af);
      color:#fff;
      box-shadow:0 7px 22px rgba(26,72,101,.18)
    }

    .account-user-card{
      padding:18px 17px;
      background:rgba(0,59,101,.17);
      border-bottom:1px solid rgba(255,255,255,.16)
    }

    .account-user-main{
      display:flex;
      align-items:center;
      gap:11px
    }

    .account-user-avatar{
      width:44px;
      height:44px;
      flex:0 0 44px;
      border-radius:50%;
      display:grid;
      place-items:center;
      background:#fff;
      color:#0879b3;
      font-size:22px;
      font-weight:800
    }

    .account-user-main strong{
      display:block;
      font-size:14px
    }

    .account-user-main span{
      display:block;
      margin-top:3px;
      opacity:.8;
      font-size:11px
    }

    .account-side-balance{
      margin-top:14px;
      padding-top:12px;
      border-top:1px solid rgba(255,255,255,.18)
    }

    .account-side-balance div{
      display:flex;
      justify-content:space-between;
      gap:10px;
      margin-top:6px;
      font-size:12px
    }

    .account-menu-group{
      padding:12px 0 6px
    }

    .account-menu-label{
      padding:2px 16px 6px;
      color:rgba(255,255,255,.66);
      font-size:10px;
      font-weight:700;
      text-transform:uppercase
    }

    .account-menu-btn,
    .account-menu-link{
      width:100%;
      min-height:43px;
      padding:0 15px;
      border:0;
      background:transparent;
      color:#fff;
      display:flex;
      align-items:center;
      gap:10px;
      text-align:left;
      text-decoration:none;
      cursor:pointer
    }

    .account-menu-btn:hover,
    .account-menu-link:hover,
    .account-menu-btn.active{
      background:rgba(0,51,91,.24)
    }

    .account-menu-btn.active{
      box-shadow:inset 4px 0 0 #63d2ff
    }

    .account-menu-icon{
      width:22px;
      text-align:center;
      opacity:.95
    }

    .account-menu-danger{
      display:inline-grid;
      place-items:center;
      min-width:18px;
      height:18px;
      margin-left:auto;
      padding:0 5px;
      border-radius:999px;
      background:#ff596f;
      color:#fff;
      font-size:9px
    }

    .account-side-logout{
      margin:10px 14px 16px;
      width:calc(100% - 28px);
      height:38px;
      border:0;
      border-radius:7px;
      color:#fff;
      background:rgba(0,55,96,.27);
      cursor:pointer
    }

    .account-main{
      min-width:0
    }

    .account-panel{
      min-height:620px;
      padding:18px;
      border-radius:10px;
      background:#f7f9fb;
      box-shadow:0 7px 22px rgba(26,72,101,.13)
    }

    .account-page-title{
      margin:0;
      color:#30445b;
      font-size:22px
    }

    .account-page-note{
      margin:5px 0 18px;
      color:#7b8795;
      font-size:12px
    }

    .account-overview{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:10px;
      margin-bottom:14px
    }

    .account-overview-card{
      min-height:98px;
      padding:14px;
      border:1px solid #dce6ef;
      border-radius:9px;
      background:#fff
    }

    .account-overview-card small{
      display:block;
      color:#8995a3;
      font-size:10px;
      text-transform:uppercase;
      letter-spacing:.4px
    }

    .account-overview-card strong{
      display:block;
      margin-top:7px;
      color:#32465d;
      font-size:18px
    }

    .account-overview-card p{
      margin:5px 0 0;
      color:#76869a;
      font-size:11px
    }

    .account-good{color:#12935f!important}
    .account-warn{color:#df7c18!important}
    .account-bad{color:#d94754!important}

    .turnover-progress{
      height:7px;
      margin-top:9px;
      overflow:hidden;
      border-radius:999px;
      background:#e7edf3
    }

    .turnover-progress i{
      display:block;
      height:100%;
      background:linear-gradient(90deg,#48a8ff,#0d80e8);
      border-radius:inherit
    }

    .account-section{
      margin-top:12px;
      padding:16px;
      border:1px solid #dfe7ef;
      border-radius:9px;
      background:#fff
    }

    .account-section-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:13px
    }

    .account-section h2{
      margin:0;
      color:#374b61;
      font-size:16px
    }

    .account-section-note{
      margin:4px 0 0;
      color:#84909f;
      font-size:11px
    }

    .profile-progress{
      min-width:170px
    }

    .profile-progress-line{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      color:#738295;
      font-size:10px
    }

    .profile-progress-bar{
      height:5px;
      margin-top:5px;
      border-radius:999px;
      overflow:hidden;
      background:#e8edf2
    }

    .profile-progress-bar i{
      display:block;
      height:100%;
      background:#58b9ef
    }

    .account-form-grid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:12px
    }

    .account-form-grid label,
    .account-settings-form label,
    .account-support-form label{
      display:grid;
      gap:6px;
      color:#526276;
      font-size:12px
    }

    .account-form-grid input,
    .account-form-grid select,
    .account-settings-form input,
    .account-support-form textarea{
      width:100%;
      min-height:44px;
      padding:9px 11px;
      border:1px solid #cfd9e3;
      border-radius:6px;
      outline:none;
      background:#fff;
      color:#34455a
    }

    .account-form-grid input:focus,
    .account-form-grid select:focus,
    .account-settings-form input:focus,
    .account-support-form textarea:focus{
      border-color:#3d9ee8;
      box-shadow:0 0 0 3px rgba(61,158,232,.10)
    }

    .account-form-grid .full-row{
      grid-column:1/-1
    }

    .account-form-actions{
      display:flex;
      gap:9px;
      flex-wrap:wrap;
      margin-top:14px
    }

    .account-primary,
    .account-secondary{
      min-height:42px;
      padding:0 18px;
      border:0;
      border-radius:6px;
      text-decoration:none;
      display:inline-grid;
      place-items:center;
      cursor:pointer;
      font-weight:700
    }

    .account-primary{
      min-width:160px;
      color:#fff;
      background:linear-gradient(180deg,#7bcf36,#63b928)
    }

    .account-secondary{
      color:#3d5d78;
      background:#edf2f6
    }

    .account-history-wrap{
      overflow:auto;
      border:1px solid #e0e7ee;
      border-radius:7px
    }

    .account-history-table{
      width:100%;
      min-width:650px;
      border-collapse:collapse;
      font-size:11px
    }

    .account-history-table th{
      height:37px;
      padding:0 9px;
      background:#eff4f8;
      color:#617184;
      font-weight:700;
      text-align:left
    }

    .account-history-table td{
      padding:10px 9px;
      border-top:1px solid #edf1f4
    }

    .account-empty{
      padding:34px 14px;
      text-align:center;
      color:#98a4b1
    }

    .account-settings-form,
    .account-support-form{
      display:grid;
      gap:11px;
      max-width:620px
    }

    .account-support-form textarea{
      min-height:130px;
      resize:vertical
    }

    .account-toast{
      position:fixed;
      top:18px;
      right:18px;
      z-index:200;
      padding:10px 14px;
      border-radius:7px;
      background:#1383c6;
      color:#fff;
      opacity:0;
      transform:translateY(-8px);
      transition:.2s;
      pointer-events:none
    }

    .account-toast.show{
      opacity:1;
      transform:none
    }

    .account-toast.error{
      background:#c94451
    }

    .status-pending{color:#c87b00}
    .status-win{color:#0a9a64}
    .status-lose{color:#d9404d}

    /* Mobile account drawer controls */
    .account-mobile-menu-button{
      display:none;
      width:40px;
      height:40px;
      padding:0;
      border:0;
      border-radius:8px;
      background:rgba(0,55,96,.30);
      color:#fff;
      font-size:22px;
      line-height:1;
      cursor:pointer
    }

    .account-menu-backdrop{
      position:fixed;
      inset:68px 0 0 0;
      z-index:39;
      background:rgba(0,0,0,.40);
      opacity:0;
      pointer-events:none;
      transition:opacity .2s ease
    }

    .account-menu-backdrop.open{
      opacity:1;
      pointer-events:auto
    }

    @media(max-width:820px){
      body.account-page{
        background:#eef3f7
      }

      .account-top{
        height:56px
      }

      .account-top-inner{
        width:calc(100% - 18px);
        gap:8px
      }

      .account-logo img{
        width:62px
      }

      .account-top-balance{
        padding:4px 8px
      }

      .account-top-balance small{
        display:none
      }

      .account-back{
        font-size:0;
        width:38px;
        padding:0
      }

      .account-back::before{
        content:"←";
        font-size:20px
      }

      .account-logout{
        display:none
      }

      .account-shell{
        width:100%;
        margin:0;
        display:block
      }

      .account-mobile-menu-button{
        display:grid;
        place-items:center;
        flex:0 0 40px
      }

      .account-menu-backdrop{
        inset:56px 0 0 0
      }

      /*
       * MOBILE ACCOUNT DRAWER - 1 CỘT
       */
      .account-sidebar{
        position:fixed;
        top:56px;
        left:0;
        bottom:0;
        z-index:45;

        width:min(82vw,300px);
        max-width:300px;

        display:block!important;
        overflow-y:auto;

        border-radius:0 12px 12px 0;

        transform:translateX(-105%);
        transition:transform .22s ease;

        box-shadow:8px 0 24px rgba(0,0,0,.22)
      }

      .account-sidebar.open{
        transform:translateX(0)
      }

      /*
       * USER CARD - thông tin nằm ngang
       */
      .account-user-card{
        width:100%;
        padding:14px;
        display:block;
        background:rgba(0,59,101,.17)
      }

      .account-user-main{
        width:100%;
        display:flex;
        flex-direction:row;
        align-items:center;
        gap:10px
      }

      .account-user-avatar{
        width:42px;
        height:42px;
        flex:0 0 42px
      }

      .account-user-main > div:last-child{
        flex:1;
        min-width:0
      }

      .account-user-main strong{
        white-space:nowrap;
        overflow:hidden;
        text-overflow:ellipsis
      }

      .account-side-balance{
        display:flex!important;
        align-items:flex-start;
        justify-content:space-between;
        gap:10px;

        margin-top:11px;
        padding-top:10px;

        border-top:1px solid rgba(255,255,255,.18)
      }

      .account-side-balance div{
        flex:1;
        margin:0!important;

        display:flex;
        flex-direction:column;
        gap:2px
      }

      .account-side-balance div:last-child{
        text-align:right
      }

      /*
       * MENU - 1 CỘT DỌC
       */
      .account-menu-group{
        width:100%;
        display:block!important;
        overflow:visible;
        padding:7px 0
      }

      .account-menu-label{
        display:block;
        width:100%;

        padding:10px 15px 5px;

        color:rgba(255,255,255,.62);
        font-size:10px;
        font-weight:700
      }

      .account-menu-btn,
      .account-menu-link{
        width:100%!important;
        min-height:44px;

        padding:0 15px;

        display:flex!important;
        flex-direction:row!important;
        align-items:center;

        gap:10px;

        border-radius:0;

        white-space:nowrap;
        font-size:13px;
        text-align:left
      }

      .account-menu-icon{
        width:23px;
        flex:0 0 23px;
        text-align:center
      }

      .account-menu-btn > span:last-of-type,
      .account-menu-link > span:last-of-type{
        flex:1;
        min-width:0;

        white-space:nowrap;
        overflow:hidden;
        text-overflow:ellipsis
      }

      .account-menu-btn.active{
        background:rgba(0,54,95,.28);
        box-shadow:inset 4px 0 0 #6ad4ff
      }

      .account-menu-danger{
        display:inline-grid;
        flex:0 0 auto;
        margin-left:auto
      }

      /*
       * ĐĂNG XUẤT
       */
      .account-side-logout{
        display:block;

        width:calc(100% - 28px);
        height:40px;

        margin:12px 14px 18px
      }

      .account-main{
        padding:10px
      }

      .account-panel{
        min-height:0;
        padding:12px;
        border-radius:10px
      }

      .account-overview{
        grid-template-columns:1fr
      }

      .account-form-grid{
        grid-template-columns:1fr
      }

      .account-section-head{
        align-items:flex-start;
        flex-direction:column
      }

      .profile-progress{
        width:100%
      }

      .account-form-actions{
        display:grid;
        grid-template-columns:1fr 1fr
      }

      .account-form-actions .account-primary{
        grid-column:1/-1
      }
    }

    /* =========================================================
       MOBILE DRAWER CLEAN - LIỀN KHỐI, KHÔNG CÒN CÁC "CỤC" RỜI
       ========================================================= */
    @media(max-width:820px){

      .account-sidebar{
        background:linear-gradient(180deg,#0788c5 0%,#077caf 100%) !important;
        border-radius:0 14px 14px 0 !important;
      }

      .account-user-card{
        margin:0 !important;
        padding:16px 16px 14px !important;
        border-radius:0 !important;
        background:rgba(0,62,105,.16) !important;
        border-bottom:1px solid rgba(255,255,255,.16) !important;
      }

      .account-menu-group{
        margin:0 !important;
        padding:7px 0 0 !important;
        background:transparent !important;
      }

      .account-menu-label{
        margin:0 !important;
        padding:11px 16px 6px !important;
        color:rgba(255,255,255,.66) !important;
        background:transparent !important;
        font-size:10px !important;
        line-height:14px !important;
        font-weight:700 !important;
        border:0 !important;
      }

      .account-menu-btn,
      .account-menu-link{
        width:100% !important;
        min-height:47px !important;
        margin:0 !important;
        padding:0 16px !important;
        border:0 !important;
        border-radius:0 !important;
        display:flex !important;
        align-items:center !important;
        gap:11px !important;
        background:transparent !important;
        color:#fff !important;
        box-shadow:none !important;
        font-size:13px !important;
        line-height:18px !important;
        text-decoration:none !important;
        border-bottom:1px solid rgba(255,255,255,.075) !important;
      }

      .account-menu-btn:hover,
      .account-menu-link:hover{
        background:rgba(0,54,94,.16) !important;
      }

      .account-menu-btn.active{
        color:#fff !important;
        background:rgba(255,255,255,.13) !important;
        box-shadow:inset 4px 0 0 #79dcff !important;
      }

      .account-menu-icon{
        width:24px !important;
        flex:0 0 24px !important;
        display:grid !important;
        place-items:center !important;
        color:#fff !important;
        opacity:.95 !important;
        font-size:16px !important;
      }

      .account-menu-btn > span:last-of-type,
      .account-menu-link > span:last-of-type{
        flex:1 !important;
        min-width:0 !important;
        color:#fff !important;
        white-space:nowrap !important;
        overflow:hidden !important;
        text-overflow:ellipsis !important;
      }

      .account-menu-danger{
        margin-left:auto !important;
        min-width:18px !important;
        height:18px !important;
        display:inline-grid !important;
        place-items:center !important;
        border-radius:999px !important;
        background:#ff566d !important;
        color:#fff !important;
        font-size:9px !important;
        font-style:normal !important;
      }

      .account-side-logout{
        width:100% !important;
        height:49px !important;
        margin:8px 0 0 !important;
        padding:0 16px !important;
        border:0 !important;
        border-radius:0 !important;
        display:flex !important;
        align-items:center !important;
        justify-content:flex-start !important;
        gap:10px !important;
        background:rgba(0,52,92,.18) !important;
        color:#fff !important;
        box-shadow:inset 0 1px 0 rgba(255,255,255,.08) !important;
        font-size:13px !important;
        font-weight:400 !important;
        text-align:left !important;
      }

      .account-side-logout:hover{
        background:rgba(0,52,92,.28) !important;
      }

      .account-side-balance{
        margin-top:13px !important;
        padding-top:11px !important;
        border-top:1px solid rgba(255,255,255,.16) !important;
      }

      .account-side-balance div{
        color:rgba(255,255,255,.88) !important;
      }

      .account-side-balance b{
        color:#fff !important;
      }
    }

  </style>
</head>

<body class="account-page">
  <div id="accountToast" class="account-toast"></div>

  <header class="account-top">
    <div class="account-top-inner">
      <a class="account-logo" href="index.html" aria-label="Về trang trò chơi">
        <img src="./logo-234.png" alt="234">
      </a>

      <a class="account-back" href="index.html">← Về trang trò chơi</a>

      <button
        id="accountMobileMenu"
        class="account-mobile-menu-button"
        type="button"
        aria-label="Mở menu tài khoản"
        aria-expanded="false"
      >
        ☰
      </button>

      <div class="account-top-spacer"></div>

      <div class="account-top-balance">
        <span>💳</span>
        <div>
          <small>Số dư tài khoản</small>
          <strong id="accountTopBalance">0 VND</strong>
        </div>
      </div>

      <button id="accountLogoutTop" class="account-logout" type="button">
        Đăng xuất
      </button>
    </div>
  </header>

  <div
    id="accountMenuBackdrop"
    class="account-menu-backdrop"
    aria-hidden="true"
  ></div>

  <main class="account-shell">
    <aside class="account-sidebar">
      <div class="account-user-card">
        <div class="account-user-main">
          <div class="account-user-avatar">👤</div>
          <div>
            <strong id="accountSideUsername">Tài khoản</strong>
            <span>Hồ sơ và ví của tôi</span>
          </div>
        </div>

        <div class="account-side-balance">
          <div><span>Điểm</span><b>0</b></div>
          <div><span>Tài khoản chính (VND)</span><b id="accountSideBalance">0</b></div>
        </div>
      </div>

      <div class="account-menu-group">
        <div class="account-menu-label">Ví và cược của tôi</div>

        <a class="account-menu-link" href="index.html?wallet=deposit">
          <span class="account-menu-icon">＄</span>
          <span>Nạp tiền</span>
        </a>

        <a class="account-menu-link" href="index.html?wallet=withdraw">
          <span class="account-menu-icon">↥</span>
          <span>Rút tiền</span>
        </a>

        <button class="account-menu-btn" type="button" data-tab="history">
          <span class="account-menu-icon">◷</span>
          <span>Lịch sử cược</span>
        </button>

        <div class="account-menu-label">Hồ sơ</div>

        <button class="account-menu-btn" type="button" data-tab="profile">
          <span class="account-menu-icon">👤</span>
          <span>Hồ sơ cá nhân</span>
          <i id="profileAlertBadge" class="account-menu-danger">!</i>
        </button>

        <button class="account-menu-btn" type="button" data-tab="settings">
          <span class="account-menu-icon">⚙</span>
          <span>Cài đặt tài khoản</span>
        </button>

        <button class="account-menu-btn" type="button" data-tab="support">
          <span class="account-menu-icon">🎧</span>
          <span>Hỗ trợ / Khiếu nại</span>
        </button>
      </div>

      <button id="accountLogoutSide" class="account-side-logout" type="button">
        ↪ Đăng xuất
      </button>
    </aside>

    <section class="account-main">
      <div id="accountPanel" class="account-panel"></div>
    </section>
  </main>

  <script>
  (()=>{
    /*
     * PHẢI trùng với app.js.
     * Bản account cũ đang dùng lotto_demo_v9_* nên
     * có thể không nhìn thấy phiên đăng nhập của trang chính.
     */
    const DB_KEY='lotto_v9_db';
    const SESSION_KEY='lotto_v9_session';

    const panel=document.getElementById('accountPanel');

    const fmt=value=>
      Number(value||0).toLocaleString('vi-VN');

    const esc=value=>String(value??'').replace(
      /[&<>"']/g,
      character=>({
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#039;'
      }[character])
    );

    function hash(text){
      let value=2166136261;

      for(let index=0;index<text.length;index++){
        value^=text.charCodeAt(index);
        value=Math.imul(value,16777619);
      }

      return(value>>>0).toString(16);
    }

    function migrateOldAccountStorage(){
      if(
        !localStorage.getItem(DB_KEY)&&
        localStorage.getItem('lotto_demo_v9_db')
      ){
        localStorage.setItem(
          DB_KEY,
          localStorage.getItem('lotto_demo_v9_db')
        );
      }

      if(
        !localStorage.getItem(SESSION_KEY)&&
        localStorage.getItem('lotto_demo_v9_session')
      ){
        localStorage.setItem(
          SESSION_KEY,
          localStorage.getItem('lotto_demo_v9_session')
        );
      }
    }

    function getDb(){
      migrateOldAccountStorage();

      try{
        const database=
          JSON.parse(localStorage.getItem(DB_KEY))||{};

        database.users=database.users||{};
        database.bets=Array.isArray(database.bets)
          ? database.bets
          : [];

        Object.values(database.users).forEach(account=>{
          account.balance=Number(account.balance||0);
          account.profile=account.profile||{};
          account.walletTransactions=
            Array.isArray(account.walletTransactions)
              ? account.walletTransactions
              : [];
          account.withdrawals=
            Array.isArray(account.withdrawals)
              ? account.withdrawals
              : [];
          account.complaints=
            Array.isArray(account.complaints)
              ? account.complaints
              : [];
          account.withdrawTurnoverRequired=
            Number(account.withdrawTurnoverRequired||0);
          account.withdrawTurnoverCompleted=
            Number(account.withdrawTurnoverCompleted||0);
        });

        return database;
      }catch{
        return{
          users:{},
          bets:[]
        };
      }
    }

    function saveDb(database){
      localStorage.setItem(
        DB_KEY,
        JSON.stringify(database)
      );
    }

    function currentName(){
      migrateOldAccountStorage();
      return localStorage.getItem(SESSION_KEY)||'';
    }

    function currentUser(database=getDb()){
      return database.users[currentName()]||null;
    }

    function notify(message,error=false){
      const box=document.getElementById('accountToast');

      box.textContent=message;
      box.classList.toggle('error',error);
      box.classList.add('show');

      clearTimeout(notify.timer);

      notify.timer=setTimeout(
        ()=>box.classList.remove('show'),
        2300
      );
    }

    function profileReady(account){
      const profile=account?.profile||{};

      return Boolean(
        profile.fullname&&
        profile.phone&&
        profile.bank&&
        profile.bankName&&
        profile.bankAccount
      );
    }

    function profileCompletion(account){
      const profile=account?.profile||{};

      const values=[
        profile.fullname,
        profile.phone,
        profile.bank,
        profile.bankName,
        profile.bankAccount
      ];

      const completed=
        values.filter(value=>String(value||'').trim()).length;

      return{
        completed,
        total:values.length,
        percent:Math.round(
          (completed/values.length)*100
        )
      };
    }

    function turnoverState(account){
      const required=
        Number(account?.withdrawTurnoverRequired||0);

      const completedRaw=
        Number(account?.withdrawTurnoverCompleted||0);

      const completed=
        Math.min(
          Math.max(0,completedRaw),
          required
        );

      const remaining=
        Math.max(
          0,
          required-completed
        );

      const percent=
        required>0
          ? Math.min(
              100,
              Math.round(
                completed/required*100
              )
            )
          : 100;

      return{
        required,
        completed,
        remaining,
        percent,
        ready:remaining<=0
      };
    }

    function requireAccount(){
      if(currentUser()){
        return true;
      }

      window.location.replace('index.html');
      return false;
    }

    function renderHeader(){
      const account=currentUser();

      if(!account){
        return;
      }

      document.getElementById('accountTopBalance').textContent=
        `${fmt(account.balance)} VND`;

      document.getElementById('accountSideBalance').textContent=
        fmt(account.balance);

      document.getElementById('accountSideUsername').textContent=
        account.username||currentName();

      document.getElementById('profileAlertBadge')
        ?.classList.toggle(
          'hidden',
          profileReady(account)
        );
    }

    function overviewHtml(account){
      const turnover=turnoverState(account);
      const completedProfile=profileReady(account);

      return`
        <div class="account-overview">

          <div class="account-overview-card">
            <small>Số dư tài khoản</small>
            <strong>${fmt(account.balance)} VND</strong>
            <p>Số dư đang có trên thiết bị này.</p>
          </div>

          <div class="account-overview-card">
            <small>Điều kiện vòng cược</small>
            <strong class="${turnover.ready?'account-good':'account-warn'}">
              ${turnover.ready?'Đã hoàn thành':`${fmt(turnover.completed)} / ${fmt(turnover.required)} VND`}
            </strong>

            <div class="turnover-progress">
              <i style="width:${turnover.percent}%"></i>
            </div>

            <p>
              ${
                turnover.ready
                  ? 'Đã đủ điều kiện doanh số tiền nạp.'
                  : `Còn cần tham gia ${fmt(turnover.remaining)} VND.`
              }
            </p>
          </div>

          <div class="account-overview-card">
            <small>Hồ sơ nhận tiền</small>
            <strong class="${completedProfile?'account-good':'account-bad'}">
              ${completedProfile?'Đã hoàn tất':'Chưa hoàn tất'}
            </strong>
            <p>
              ${
                completedProfile
                  ? 'Thông tin nhận tiền đã đầy đủ.'
                  : 'Vui lòng điền đủ thông tin bắt buộc.'
              }
            </p>
          </div>

        </div>
      `;
    }

    function profileView(){
      const account=currentUser();
      const profile=account.profile||{};
      const withdrawals=
        Array.isArray(account.withdrawals)
          ? account.withdrawals
          : [];

      const latestWithdrawals=
        withdrawals.slice(0,5);

      const progress=
        profileCompletion(account);

      panel.innerHTML=`
        <h1 class="account-page-title">
          Hồ sơ tài khoản
        </h1>

        <p class="account-page-note">
          Hoàn thiện hồ sơ nhận tiền và theo dõi điều kiện rút tiền của tài khoản.
        </p>

        ${overviewHtml(account)}

        <section class="account-section">
          <div class="account-section-head">
            <div>
              <h2>Thông tin cá nhân và nhận tiền</h2>
              <p class="account-section-note">
                Các trường có dấu * là bắt buộc để thực hiện yêu cầu rút tiền.
              </p>
            </div>

            <div class="profile-progress">
              <div class="profile-progress-line">
                <span>Điền vào hồ sơ</span>
                <b>${progress.percent}%</b>
              </div>
              <div class="profile-progress-bar">
                <i style="width:${progress.percent}%"></i>
              </div>
            </div>
          </div>

          <form id="profileForm">
            <div class="account-form-grid">

              <label>
                Họ và tên *
                <input
                  id="profileFullname"
                  value="${esc(profile.fullname||'')}"
                  autocomplete="name"
                  required
                >
              </label>

              <label>
                Số điện thoại *
                <input
                  id="profilePhone"
                  value="${esc(profile.phone||'')}"
                  inputmode="tel"
                  autocomplete="tel"
                  placeholder="Ví dụ: 09xxxxxxxx"
                  required
                >
              </label>

              <label>
                Ngân hàng *
                <input
                  id="profileBank"
                  value="${esc(profile.bank||'')}"
                  placeholder="Ví dụ: Vietcombank"
                  required
                >
              </label>

              <label>
                Chủ tài khoản *
                <input
                  id="profileBankName"
                  value="${esc(profile.bankName||'')}"
                  placeholder="Tên chủ tài khoản ngân hàng"
                  required
                >
              </label>

              <label>
                Số tài khoản *
                <input
                  id="profileBankAccount"
                  value="${esc(profile.bankAccount||'')}"
                  inputmode="numeric"
                  autocomplete="off"
                  placeholder="Nhập số tài khoản"
                  required
                >
              </label>

              <label>
                Quốc gia
                <input
                  value="Việt Nam"
                  readonly
                >
              </label>

            </div>

            <div class="account-form-actions">
              <button
                class="account-primary"
                type="submit"
              >
                LƯU HỒ SƠ
              </button>

              <a
                class="account-secondary"
                href="index.html?wallet=deposit"
              >
                Nạp tiền
              </a>

              <a
                class="account-secondary"
                href="index.html?wallet=withdraw"
              >
                Rút tiền
              </a>
            </div>
          </form>
        </section>

        <section class="account-section">
          <div class="account-section-head">
            <div>
              <h2>Yêu cầu rút gần nhất</h2>
              <p class="account-section-note">
                Thông tin yêu cầu được lưu theo tài khoản trên thiết bị.
              </p>
            </div>
          </div>

          ${
            latestWithdrawals.length
              ? `
                <div class="account-history-wrap">
                  <table class="account-history-table">
                    <thead>
                      <tr>
                        <th>Mã</th>
                        <th>Thời gian</th>
                        <th>Số tiền</th>
                        <th>Trạng thái</th>
                      </tr>
                    </thead>
                    <tbody>
                      ${
                        latestWithdrawals.map(item=>`
                          <tr>
                            <td>${esc(item.id)}</td>
                            <td>${new Date(item.createdAt).toLocaleString('vi-VN')}</td>
                            <td>${fmt(item.amount)} VND</td>
                            <td>Đang xử lý</td>
                          </tr>
                        `).join('')
                      }
                    </tbody>
                  </table>
                </div>
              `
              : '<div class="account-empty">Chưa có yêu cầu rút tiền.</div>'
          }
        </section>
      `;

      document.getElementById('profileForm').onsubmit=event=>{
        event.preventDefault();

        const database=getDb();
        const savedAccount=currentUser(database);

        savedAccount.profile={
          ...(savedAccount.profile||{}),

          fullname:
            document.getElementById('profileFullname')
              .value.trim(),

          phone:
            document.getElementById('profilePhone')
              .value.trim(),

          bank:
            document.getElementById('profileBank')
              .value.trim(),

          bankName:
            document.getElementById('profileBankName')
              .value.trim(),

          bankAccount:
            document.getElementById('profileBankAccount')
              .value.replace(/\D/g,'')
        };

        if(!profileReady(savedAccount)){
          notify(
            'Vui lòng điền đầy đủ các trường bắt buộc.',
            true
          );
          return;
        }

        saveDb(database);

        notify(
          'Đã lưu hồ sơ nhận tiền.'
        );

        renderHeader();
        profileView();
      };

      const bankAccountInput=
        document.getElementById('profileBankAccount');

      bankAccountInput.oninput=()=>{
        bankAccountInput.value=
          bankAccountInput.value.replace(/\D/g,'');
      };
    }

    function historyView(){
      const database=getDb();

      const bets=database.bets
        .filter(
          bet=>bet.username===currentName()
        )
        .sort(
          (a,b)=>
            new Date(b.createdAt)-
            new Date(a.createdAt)
        );

      const statusText={
        pending:'Chờ kết quả',
        win:'Thắng',
        lose:'Thua'
      };

      panel.innerHTML=`
        <h1 class="account-page-title">
          Lịch sử cược
        </h1>

        <p class="account-page-note">
          Các vé cược của tài khoản đang đăng nhập.
        </p>

        ${overviewHtml(currentUser())}

        <section class="account-section">
          ${
            bets.length
              ? `
                <div class="account-history-wrap">
                  <table class="account-history-table">
                    <thead>
                      <tr>
                        <th>Ngày đặt</th>
                        <th>Kỳ</th>
                        <th>Loại</th>
                        <th>Số</th>
                        <th>Tiền cược</th>
                        <th>Kết quả</th>
                        <th>Tiền thắng</th>
                      </tr>
                    </thead>

                    <tbody>
                      ${
                        bets.map(bet=>`
                          <tr>
                            <td>${new Date(bet.createdAt).toLocaleString('vi-VN')}</td>
                            <td>${esc(bet.draw||bet.drawDate||'')}</td>
                            <td>${esc(bet.sub||bet.game||'')}</td>
                            <td>${esc((bet.numbers||[]).join(', '))}</td>
                            <td>${fmt(bet.total)} VND</td>
                            <td class="status-${esc(bet.status||'pending')}">
                              ${statusText[bet.status]||'Chờ kết quả'}
                            </td>
                            <td>${fmt(bet.payout||0)} VND</td>
                          </tr>
                        `).join('')
                      }
                    </tbody>
                  </table>
                </div>
              `
              : '<div class="account-empty">Tài khoản chưa có vé cược.</div>'
          }
        </section>
      `;
    }

    function settingsView(){
      panel.innerHTML=`
        <h1 class="account-page-title">
          Cài đặt tài khoản
        </h1>

        <p class="account-page-note">
          Quản lý mật khẩu của tài khoản đang đăng nhập trên thiết bị này.
        </p>

        ${overviewHtml(currentUser())}

        <section class="account-section">
          <div class="account-section-head">
            <div>
              <h2>Bảo mật tài khoản</h2>
              <p class="account-section-note">
                Nên sử dụng mật khẩu riêng cho tài khoản này.
              </p>
            </div>
          </div>

          <form
            id="passwordForm"
            class="account-settings-form"
          >
            <label>
              Mật khẩu hiện tại
              <input
                id="oldPassword"
                type="password"
                required
              >
            </label>

            <label>
              Mật khẩu mới
              <input
                id="newPassword"
                type="password"
                minlength="4"
                required
              >
            </label>

            <label>
              Nhập lại mật khẩu mới
              <input
                id="repeatPassword"
                type="password"
                minlength="4"
                required
              >
            </label>

            <button
              class="account-primary"
              type="submit"
            >
              Đổi mật khẩu
            </button>
          </form>
        </section>
      `;

      document.getElementById('passwordForm').onsubmit=event=>{
        event.preventDefault();

        const database=getDb();
        const account=currentUser(database);

        const oldPassword=
          document.getElementById('oldPassword').value;

        const newPassword=
          document.getElementById('newPassword').value;

        const repeated=
          document.getElementById('repeatPassword').value;

        if(account.passwordHash!==hash(oldPassword)){
          notify(
            'Mật khẩu hiện tại không đúng.',
            true
          );
          return;
        }

        if(
          newPassword.length<4||
          newPassword!==repeated
        ){
          notify(
            'Mật khẩu mới chưa hợp lệ hoặc không khớp.',
            true
          );
          return;
        }

        account.passwordHash=
          hash(newPassword);

        saveDb(database);

        event.target.reset();

        notify(
          'Đã đổi mật khẩu.'
        );
      };
    }

    function supportView(){
      const account=currentUser();

      const complaints=
        Array.isArray(account.complaints)
          ? account.complaints
          : [];

      panel.innerHTML=`
        <h1 class="account-page-title">
          Trung tâm hỗ trợ
        </h1>

        <p class="account-page-note">
          Gửi nội dung cần kiểm tra. Dữ liệu được lưu trên thiết bị này.
        </p>

        <section class="account-section">
          <div class="account-section-head">
            <div>
              <h2>Thắc mắc / Khiếu nại</h2>
              <p class="account-section-note">
                Mô tả rõ vấn đề để dễ theo dõi lại.
              </p>
            </div>
          </div>

          <form
            id="supportForm"
            class="account-support-form"
          >
            <label>
              Nội dung
              <textarea
                id="supportContent"
                placeholder="Nhập nội dung cần hỗ trợ..."
                required
              ></textarea>
            </label>

            <button
              class="account-primary"
              type="submit"
            >
              Gửi yêu cầu
            </button>
          </form>
        </section>

        <section class="account-section">
          <div class="account-section-head">
            <div>
              <h2>Đã gửi gần đây</h2>
            </div>
          </div>

          ${
            complaints.length
              ? complaints.slice(0,5).map(item=>`
                  <div style="
                    padding:12px 0;
                    border-bottom:1px solid #e7edf4;
                    font-size:13px
                  ">
                    <b>
                      ${new Date(item.createdAt).toLocaleString('vi-VN')}
                    </b>

                    <p style="margin:5px 0">
                      ${esc(item.content)}
                    </p>

                    <span style="color:#d58a00">
                      Đang xử lý
                    </span>
                  </div>
                `).join('')
              : '<div class="account-empty">Chưa gửi yêu cầu hỗ trợ.</div>'
          }
        </section>
      `;

      document.getElementById('supportForm').onsubmit=event=>{
        event.preventDefault();

        const content=
          document.getElementById('supportContent')
            .value.trim();

        if(!content){
          return;
        }

        const database=getDb();
        const savedAccount=currentUser(database);

        savedAccount.complaints=
          Array.isArray(savedAccount.complaints)
            ? savedAccount.complaints
            : [];

        savedAccount.complaints.unshift({
          id:`KN-${Date.now()}`,
          content,
          status:'pending',
          createdAt:new Date().toISOString()
        });

        saveDb(database);

        notify(
          'Đã lưu yêu cầu hỗ trợ.'
        );

        supportView();
      };
    }

    function setMobileAccountMenu(open){
      const sidebar=
        document.querySelector('.account-sidebar');

      const backdrop=
        document.getElementById('accountMenuBackdrop');

      const button=
        document.getElementById('accountMobileMenu');

      if(!sidebar||!backdrop||!button){
        return;
      }

      sidebar.classList.toggle(
        'open',
        Boolean(open)
      );

      backdrop.classList.toggle(
        'open',
        Boolean(open)
      );

      backdrop.setAttribute(
        'aria-hidden',
        String(!open)
      );

      button.setAttribute(
        'aria-expanded',
        String(Boolean(open))
      );

      button.textContent=
        open
          ? '×'
          : '☰';
    }

    const views={
      profile:profileView,
      history:historyView,
      settings:settingsView,
      support:supportView
    };

    function openTab(tab){
      const selected=
        views[tab]
          ? tab
          : 'profile';

      document
        .querySelectorAll('[data-tab]')
        .forEach(button=>{
          button.classList.toggle(
            'active',
            button.dataset.tab===selected
          );
        });

      const url=
        new URL(window.location.href);

      url.searchParams.set(
        'tab',
        selected
      );

      history.replaceState(
        null,
        '',
        url
      );

      views[selected]();
    }

    function logout(){
      localStorage.removeItem(SESSION_KEY);
      window.location.replace('index.html');
    }

    if(!requireAccount()){
      return;
    }

    renderHeader();

    document
      .querySelectorAll('[data-tab]')
      .forEach(button=>{
        button.onclick=()=>{
          openTab(
            button.dataset.tab
          );

          setMobileAccountMenu(
            false
          );
        };
      });

    document.getElementById('accountLogoutTop').onclick=
      logout;

    document.getElementById('accountLogoutSide').onclick=
      logout;

    document.getElementById('accountMobileMenu').onclick=()=>{
      const sidebar=
        document.querySelector('.account-sidebar');

      setMobileAccountMenu(
        !sidebar?.classList.contains('open')
      );
    };

    document.getElementById('accountMenuBackdrop').onclick=()=>{
      setMobileAccountMenu(false);
    };

    document.addEventListener(
      'keydown',
      event=>{
        if(event.key==='Escape'){
          setMobileAccountMenu(false);
        }
      }
    );

    /*
     * Khi từ mobile chuyển lên desktop,
     * đảm bảo drawer không bị giữ trạng thái mở.
     */
    window.addEventListener(
      'resize',
      ()=>{
        if(window.innerWidth>820){
          setMobileAccountMenu(false);
        }
      }
    );

    openTab(
      new URLSearchParams(
        window.location.search
      ).get('tab')||'profile'
    );

  })();
  </script>
</body>
</html>
